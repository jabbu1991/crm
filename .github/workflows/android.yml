# Builds the Real View Android app (APK). Run it from GitHub: Actions → "Build Android app" → Run workflow.
# Needs one repository secret: APK_KEY_PASSWORD (any strong password you choose; keep a copy safe).
# The first run makes the app's signing key, locks it with that password and saves it in the repo
# (android/release.keystore.enc). Later runs reuse it, so new APKs install over the old app.
name: Build Android app

on:
  workflow_dispatch:
  push:
    branches: [claude/marketing-agency-crm-y3shvh]
    paths: ["android/**", ".github/workflows/android.yml"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the password secret
        env:
          APK_KEY_PASSWORD: ${{ secrets.APK_KEY_PASSWORD }}
        run: |
          if [ -z "$APK_KEY_PASSWORD" ]; then
            echo "::error::Add the secret APK_KEY_PASSWORD first: Settings → Secrets and variables → Actions → New repository secret"
            exit 1
          fi
          if [ ${#APK_KEY_PASSWORD} -lt 8 ]; then
            echo "::error::APK_KEY_PASSWORD must be at least 8 characters"
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Signing key (make it once, then reuse)
        env:
          APK_KEY_PASSWORD: ${{ secrets.APK_KEY_PASSWORD }}
        run: |
          set -e
          KS="$RUNNER_TEMP/release.keystore"
          if [ -f android/release.keystore.enc ]; then
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:APK_KEY_PASSWORD \
              -in android/release.keystore.enc -out "$KS"
          else
            keytool -genkeypair -v -keystore "$KS" -storetype PKCS12 -alias realview -keyalg RSA -keysize 2048 \
              -validity 10000 -storepass "$APK_KEY_PASSWORD" -keypass "$APK_KEY_PASSWORD" \
              -dname "CN=Real View, O=Real View Creative Studio, C=IN"
            openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -pass env:APK_KEY_PASSWORD \
              -in "$KS" -out android/release.keystore.enc
            git config user.name "github-actions"
            git config user.email "github-actions@users.noreply.github.com"
            git add android/release.keystore.enc
            git commit -m "Android app: save the (password-locked) signing key"
            git push
          fi
          echo "KEYSTORE_PATH=$KS" >> "$GITHUB_ENV"

      - name: Build the APK
        env:
          APK_KEY_PASSWORD: ${{ secrets.APK_KEY_PASSWORD }}
        run: gradle -p android assembleRelease --no-daemon --stacktrace

      - name: Name the file
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk "out/RealView-${GITHUB_RUN_NUMBER}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: RealView-app-${{ github.run_number }}
          path: out/*.apk
          retention-days: 90
